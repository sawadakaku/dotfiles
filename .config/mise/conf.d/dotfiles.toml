# Global tool versions managed by mise.
# Rust (rustup), Python (uv) and Go (Homebrew) are managed outside of mise.
# Linked to ~/.config/mise/conf.d/dotfiles.toml. Machine-local overrides (`mise use -g`)
# go to ~/.config/mise/config.toml, which takes precedence. Pin per-project versions in mise.toml.

[tools]
node = "latest"
ruby = "latest"
java = "temurin-25"
bazelisk = "latest"
sbt = "latest"
scala = "2.13"
